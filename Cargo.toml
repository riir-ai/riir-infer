[dev-dependencies]
# The laya encoder lane — the capture driver's checkpoint source (CPU
# backend; the capture hook rides the same-named `twt_profile` feature).
# DEV-ONLY: normal edges never resolve the lane tree (BOUNDARY.md keeps
# the dependency direction; the fence's F1 containment covers the path).
riir-infer-laya = { path = "crates/riir-infer-laya", features = [
    "laya-riir",
    "twt_profile",
] }

# ─── Workspace ────────────────────────────────────────────────────────
# The repo is a root-package workspace: riir-infer-core at the root,
# the GPU kernel layer as a member (it carries the wgpu/cubecl tree,
# which CPU-only consumers of the core never resolve into their builds),
# and the pinned-checkpoint encoder lane as a member (it carries the
# tokenizers/gemm tree, which lane-free consumers never resolve).
[workspace]
members = ["crates/riir-infer-gpu", "crates/riir-infer-laya", "crates/riir-infer-ane", "crates/riir-infer-clef", "crates/riir-infer-audio", "crates/riir-infer-dist"]

# ─────────────────────────────────────────────────────────────────────────────
# Build profiles — dev debuginfo budget (riir-infer Issue 1195; the proven
# katgpt-rs shape from riir-ai .issues/723 Phase 1).
# ─────────────────────────────────────────────────────────────────────────────
# Dev builds emitted FULL debuginfo since birth (macOS split-debuginfo lands
# DWARF in per-CGU .o files under target/debug/deps — the ~30 GB dirty-cache
# class and the multi-GB test binaries past boundary rows keep LIST-ing).
# Two dev-only levers, behavior-neutral by construction (debuginfo is not
# codegen — binaries stay bit-identical; plain --release untouched, it is the
# frozen league/bench posture):
#
#   [profile.dev]            debug = "line-tables-only"  — file:line kept for
#       first-party code, locals deliberately dropped (the EXPLICIT string
#       spelling, never `debug = 1`).
#   [profile.dev.package."*"] debug = false              — deps carry no
#       debuginfo (backtraces through deps lose file:line; delete this block
#       for a debugger session that needs them, or use --profile dev-full).
#
# Measured counterintuitive result upstream (reproduced twice, do not
# "improve" blind): package."*".debug = "line-tables-only" measures WORSE
# than either lever alone. opt-level overrides for deps are deliberately NOT
# set: opt-3 dep codegen is not behavior-neutral and this root drives the
# whole closure incl. measurement lanes; upstream measured and declined it.

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The debugger escape hatch: full debuginfo at dev opt levels. Exists only
# when invoked (--profile dev-full); no script or lane names it.
[profile.dev-full]
inherits = "dev"
debug = true

# Shared dep declarations for members (the fence resolves path deps from
# each manifest's own directory, so member manifests inherit this instead
# of spelling the sibling path one level deeper).
[workspace.dependencies]
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }
# Shared DDTree/speculative substrate (the root package declares it
# directly above; members inherit from here — riir-infer-gpu's Issue-966
# grid_reselect arm is the first member consumer).
katgpt-speculative = { path = "../katgpt-rs/crates/katgpt-speculative" }
# Plan 630 / Issue 1201 T2 — the FlashStates multi-session lane's named
# substrate (the member-consumer inheritance precedent above). katgpt-kv
# carries the radix prefix tree (feature radix_prefix_cache — the member
# selects it by name, the root package's kvarn-select posture);
# katgpt-transformer carries the PagedKVCache chunk-page seam (Issue 771
# T2) + PAGE_SIZE. default-features = false mirrors the root package's
# row (kog_cpu_fusion off). Both BOUNDARY-allowlisted (the katgpt-kv row
# names it measurement-lane capability, never a default-feature dep).
katgpt-kv = { path = "../katgpt-rs/crates/katgpt-kv", default-features = false }
katgpt-transformer = { path = "../katgpt-rs/crates/katgpt-transformer", default-features = false }

# ─── Local patches (crates.io forks) ─────────────────────────────────
# Byte-identical copies of the patched crates.io sources under vendor/
# (cubecl-common carries exactly ONE upstream commit on top of the published
# 0.11.0-pre.2 source; everything else is byte-identical to the crate).
# Remove when upstream lands the fixes:
#   cubecl-runtime — drop-queue policy fix (upstream tracel-ai/cubecl#1359).
#   wgpu-hal       — total_video_memory_bytes()/raw_handle() adapter
#                    accessors (additive API; the VRAM pre-flight probes it).
#   cubecl-common  — idle device-server park fix (upstream tracel-ai/cubecl
#                    #1806 @ 6bba5fdf0): the idle loop's fixed 150 µs sleep
#                    made every buffer-fill wait out the rest of a sleep on
#                    submit→wait→submit hosts (~20% decode on an M2 Pro);
#                    now park_timeout + client-side unpark-at-buffer-fill.
#                    Patch verified upstream at 6bba5fdf0, applied cleanly
#                    over the published pre.2 source; the crate's own suite
#                    passes 95/95. No release carries it yet (0.11.0 final
#                    predates it) — drop this row on the bump past it.
#   cubecl-wgpu    — riir-ai's fork (Plan 536 / Issues 660, 663, 714, 761, 1217),
#                    canonical home moved here by Issue 1141: the raw Metal
#                    handle accessors, the bind-group cache, fallible non-vk
#                    buffer creation, and the DEFAULT-ON uniform-content cache
#                    (Bench 762/771: +20-23% M3 decode; kill-switch
#                    RIIR_UNIFORM_CACHE=0). 1217 makes the two poll-site caps
#                    env-tunable (CUBECL_WGPU_MAX_TOTAL_TASKS 512 /
#                    CUBECL_WGPU_MAX_PENDING_WRITES 64, defaults = the upstream
#                    hard-coded values — unset byte-identical). Without this row
#                    every Metal build in THIS workspace (riir-infer-dist
#                    included) ran upstream cubecl-wgpu — the Issue 1139
#                    posture gap.

[patch.crates-io]
# katgpt-rs Issue 968 residue: `block` 0.1.6 is TERMINAL upstream (last
# release 2021-01, abandoned) and carries the static-of-uninhabited-type
# future-incompat (rust-lang/rust #74840 — hard error in a future rustc).
# NOT reachable in the current graph at any posture (the lock entry is
# vestigial); the row ARMS the healed fork so any future metal->block
# re-edge resolves here, never to registry. Same one-delta fork as
# katgpt-rs 5e216a761 (inhabited opaque Class struct, MIT, ABI-safe); own
# in-repo copy so the patch path stays local.
block = { path = "vendor/block" }
cubecl-runtime = { path = "vendor/cubecl-runtime-0.11.0-pre.2" }
cubecl-wgpu = { path = "vendor/cubecl-wgpu-0.11.0-pre.2" }
cubecl-common = { path = "vendor/cubecl-common-0.11.0-pre.2" }
wgpu-hal = { path = "vendor/wgpu-hal-30.0.0" }
