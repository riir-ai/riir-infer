[package]
name = "riir-infer-core"
version = "0.1.1"
edition = "2024"
license = "MIT"
# Not published yet — the public opening is owner-gated and rides the
# fence-gate checklist first (fresh history, sanitized docs, import fence).
publish = false

# riir-infer-core — the LLM inference substrate: GGUF/safetensors weight
# loading, the quantization zoo, architecture definitions (gemma / llama /
# ternary / wall layers, deltanet, transformer, rope), and CPU reference
# paths. NO cognition, NO training, NO game/chain semantics — upstream of
# all of them. Consumed by inference engines via path dep; sibling crates
# resolve at ../katgpt-rs.
#
# Feature table mirrors the engine features that gate the code; consumers
# forward each of their copies: `X = [..., "riir-infer-core/X"]`.

[dependencies]
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }
# katgpt-types: named directly for the `act_aware_fit` enum
# (ActAwareScaleFit) — the scale-fit API lives on TernaryGroupWeights in
# types (Issue 886 P1), and katgpt-core forwards the FEATURE but not the
# enum. Same upstream repo; version walks with katgpt-core by construction.
katgpt-types = { path = "../katgpt-rs/crates/katgpt-types" }
# default-features = false: mirrors riir-engine (kog_cpu_fusion off).
katgpt-transformer = { path = "../katgpt-rs/crates/katgpt-transformer", default-features = false }
# katgpt-speculative: shared DDTree substrate (dflash.rs et al.).
katgpt-speculative = { path = "../katgpt-rs/crates/katgpt-speculative" }
# katgpt-forward: canonical clustered LM head + standard head (transformer/mtp.rs).
katgpt-forward = { path = "../katgpt-rs/crates/katgpt-forward" }
# katgpt-quant: canonical TurboQuant — the `crate::turboquant` re-export
# consumed by the moved model layer (optional, pulled by `turboquant`).
katgpt-quant = { path = "../katgpt-rs/crates/katgpt-quant", optional = true }
# katgpt-attn: flashmemory_gqa only (optional; engine keeps its own copy for
# latent_functor/static_cal_bridge.rs which does NOT move).
katgpt-attn = { path = "../katgpt-rs/crates/katgpt-attn", optional = true }
# katgpt-kv: the KVarN V-cache quantizer backend (Issue 013 T1 lane).
# default-features = false: the kvarn backend is feature-selected explicitly
# (both Issue-013 consumers — fitted_v_tables + gemma2_qkv — pull kvarn by
# name), so the namespace crate's defaults stay out of every other posture.
katgpt-kv = { path = "../katgpt-rs/crates/katgpt-kv", optional = true, default-features = false }
# katgpt-pruners: the bias-delta vocabulary (BiasDeltaBuilder/BiasDeltaTable,
# katgpt-rs Issue 920 T1) — the capture bin accumulates through the shipped
# substrate, never a hand-rolled duplicate. default-features = false,
# optional: measurement-lane capability (`hyperthink_t1` only), never a
# default-feature dep (the katgpt-kv precedent).
katgpt-pruners = { path = "../katgpt-rs/crates/katgpt-pruners", optional = true, default-features = false }

half = "2"
rayon = "1.10"
anyhow = "1"
memmap2 = "0.9"
fastrand = "2"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
blake3 = "1"

# Deletion-mask artifacts (Issue 1208 T1, opt-in `deletion_mask`): payload
# compression + the optional Ed25519 signature on the mask codec. Optional —
# the default build never compiles either (the measurement-lane-capability
# law).
zstd = { version = "0.13", optional = true }
ed25519-dalek = { version = "2", optional = true }

# SentencePiece tokenizer — Gemma 2/LLaMA text tokenization (Plan 087).
# Native-only: pulls sentencepiece-sys (C++ via cmake) which cannot compile
# for wasm32; the tokenizer module below carries the matching gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sentencepiece = "0.13"

[features]
# Pure-local gates (no dep forwards).
rotary_value_embedding = []
# Research 666 (katgpt-rs Issue 999 — CLOSED DEMOTED 2026-11-17) — the offline
# R/S Jacobian-lens lane: RelP hand-rule op maps (`lens::ops`) + the layer-stack
# fit over a headful checkpoint (the laya stability lane's deferred "headful
# lens variant"). Pure-local opt-in, same posture as `sink_audit` — offline
# once per checkpoint, zero serving-path cost. VERDICT (the pre-registered
# gates, T5): G1 hit 0.00088 vs bar 0.25 (masked 0.0646 vs the random-K null
# 0.309 — worse than random), G2 mid-band 0.400/0.047 vs 0.45/0.04, G3
# 0.1168/0.4756 vs 0.06 — DEMOTED for our stack; promotion dead; the laya
# "headful lens variant" is REFUTED-BY-VERDICT, never build it. Record:
# katgpt-rs `.research/666_…md` §7 PoC Addendum (artifacts `~/lens_t3_run_backup/`).
lens = ["deltanet_inference"]
hla = []
# Issue 049 — the GDN delta-roll state journal (`deltanet::delta_roll`):
# post-commit state recovery by rank-1 unwind (final state + per-token
# (u, k, β, g) contexts, ~64× vs per-token snapshots), under the per-head
# decay-product conditioning gate. Pure-local, opt-in POC — the consumer
# seams (spec-decode retry, kv_evict recovery, disaggregated handoff) are
# named, not yet wired. Gates: tests/gdn_delta_roll_gates.rs (G1 drift pin,
# Bench 885) + tests/gdn_delta_roll_g4_alloc.rs (G4).
gdn_delta_roll = ["deltanet_inference"]
# Issue 1221 (2026-11-17) — the Dory looped-nGPT lane: the `dory` arch
# GGUF loader (header-driven loop metadata, census pins loud) + dims.
# Pure-local opt-in (same posture as `lens`/`sink_audit`): zero serving-
# path cost, unarmed builds compile the module to nothing. T1 forward +
# proofs land behind the same gate.
dory = ["katgpt-core/gain_cost_halt"]
# Plan 622 (2026-10-22) — the TokenGate prompt-skimming lane (per-key-bias
# attention + the exact pruned-prefill quartet + the deterministically-
# constructed gate overlay). Pure-local opt-in. The kernel CAPABILITY
# (Phase 1 `*_bias` attention variants) is deliberately ungated `Option`
# parameter code — a dispatch identity at `None`; THIS feature gates the
# LANE: the serving quartet + gate overlay (Phases 2–3, wired through
# `riir_infer_core::tokengate::runtime_enabled()` at boot) and the lane's
# harness targets (the required-features rows). Runtime demote inside the
# feature: `RIIR_TOKENGATE=0|false|off`. The lane stays opt-in forever
# (lossy-surface law — Plan 622 T4.2 refuses default promotion by policy).
tokengate = []
raven = []
# eDLM (Drex DLM) segment-structured scoring lane (riir-infer Issue 1005):
# `edlm` GGUF arch + branch mask + row form + pointer head. Weights are
# CC BY-NC — local bench/comparison serving only, never a product lane.
edlm = []
gemma_lora = []
lora_still = []
# EXL3 (trellis-coded, QTIP-variant) safetensors-side quant — CPU reference
# dequantization, opt-in until the Issue-001 T6 GOAT gate (workspace rule).
exl3 = []
# Issue 027 / Plan 615: the offline LUT-grid lane — `quant::lut_grid` (the
# solver + histogram, UNGATED in the lib) + the `lut_grid_solve` bin
# (extraction + weight-space 3-arm eval over the dense GGUF artifacts).
# Measurement-only; the model-level G1 (Plan 615 T6) is a separate gate.
lut_grid = []
# Issue 040 (riir-infer R011, arXiv:2509.22445 §B.9.3): the description-length
# (MDL floor) audit — `quant::desc_len` (per-tensor stored-symbol histogram
# entropy vs stored bits, side-info-split two-part floors) + the
# `desc_len_audit` report bin + the G1 rANS reference-coder gate. Opt-in,
# report-only: audit touches no decode path, ships no codec.
desc_len = []
# Issue 1209 (Research 025, the Lazarus distill): the weight-structure
# audit lane — the five-feature reference-free census over the last
# MLP's SwiGLU block (per-neuron norm z/rank features + the gate↔up and
# token alignments at the write-norm window). Pure-local opt-in,
# REPORT-ONLY: a flag means "inspect", never "reject"; zero new deps
# (blake3 already in-tree); the fixture planter lives OUTSIDE this
# surface (test-support only). The `weight-audit` bin is the census
# front (required-features row in the same commit — the P30 law).
weight_audit = []

# Issue 1241 (2026-11-24) — the offline interventional neuron census
# (the Fermion distill, katgpt-rs Research 684): per-layer chunked
# dose-grid pushes over the down_proj columns, matched-random control
# bands via katgpt-pruners mech_attribution (Issue 1237's LANDED
# scorer primitives — consumed, never forked; `65914d256`), a
# canonical BLAKE3 artifact + a resumable cursor/rows state dir
# (compute law: durable state, per-candidate commit, --resume).
# Offline by construction (G3/G5): serving bins never link it, never a
# serving-path claim (the lens-lane demotion binds the claim this lane
# refuses to make). T1 = the runner + the hermetic G1 fixture gates
# (planted column-scale edit recovered rank-1 at the pre-registered
# max(floor, 28×band) bar, zero false fires on the 20-random-neuron
# control arm); the `neuron-census` bin (--self-test = the G1 canary)
# is the census front (required-features row in the same commit —
# P30). T2's GGUF cell routes to the 4090 --needs-cuda window.
neuron_census = ["dep:katgpt-pruners", "katgpt-pruners/mech_attribution", "deltanet_inference"]

# Issue 1250 T1 (2026-11-25, katgpt-rs Research 693 — the Anthropic
# Fellows pair distill, neuron-basis-theory): the STATIC readout
# pre-screen — a weights-only logit-lens readout map of every down_proj
# column, SIGN-SPLIT (+w and −w as separate units; the pair's type-2
# finding makes one neuron two concept units), top-K lens tokens per
# unit + per-band (early/middle/late) sharpness/margin rollups. The
# strictly-cheaper tier in front of census_screen (which needs forward
# passes) and the 1241 interventional census (557 CPU-h): v0 costs one
# dequant + one vocab-wide dot per unit, once per checkpoint. Pure-local
# opt-in (same posture as `weight_audit`): zero serving-path cost,
# zero new deps (rayon + blake3 in-tree), no forward pass at all.
# The `bucket` field ships UNASSIGNED in v1 — T2's J-share NNLS
# verbalizability pass fills it. The `readout-screen` bin is the front
# (--self-test = the G1 fixture canary; required-features row in the
# same commit — P30).
readout_screen = []

# Issue 1252 A2 (2026-11-26, katgpt-rs Research 694 — the SpikingBrain
# distill): the spike-CODING census — the offline decision-data pass
# (sparsity(k), the whole-128-group skip ceiling, the structural-zero
# decomposition against the pinned floors) that gates the lane's future
# kernel/format arms. Rides the `closed_form_write` CaptureSink seam
# (the batched_mlp hook, dense AND ternary bodies) — hence the implies
# chain mirrors sink_audit's folded posture; the ternary body needs
# deltanet_ternary_inference (+ bonsai2_hadamard for the folded league
# files at the RUN's build). Pure-local opt-in, zero serving-path cost,
# zero new deps (blake3 in-tree). The `spike-code-census` bin is the
# front (--self-test = the fixture canary; required-features row in
# the same commit — the P30 law). REPORT/decision-only: the issue's
# four pre-registered refusals bind this lane's future, not this
# census's posture.
spike_code_census = ["closed_form_write", "deltanet_ternary_inference", "bonsai2_hadamard"]

# Issue 1244 T2 (Research 040, arXiv:2611.26363) — the HiSA
# rotation-suppression census arm beside `hisa_plan`'s closed-form
# prior: per (attention layer, 16-feature rotating chunk, log-Δ band)
# ablation of the chunk's score contribution on the band, with pooled
# teacher-forced Δ-NLL + argmax flips and the E_observe/E_remove/
# E_replace band-mass trio (the paper's suppression-vs-noise read).
# REPORT-ONLY, offline by construction — the arm is a cfg-gated scratch
# field the census driver alone arms; serving bins never link it, and
# no serving-path code lands from Issue 1244. Ternary body wired (the
# Bonsai postures); the dense body's mirror is a follow-up. The census
# session/bin front is the follow-up slice (required-features row lands
# with it — P30); this row gates the kernel + its two-regime identity
# gates (`cargo test --lib --features hisa_census`). The ternary body is
# the census's only probe surface (v1), so the arm implies it — the
# dispatch wiring and the driver both compile under the feature alone.
hisa_census = ["deltanet_inference", "deltanet_ternary_inference"]

# riir-train plan 503 T0.1/T0.2 — the lattice-conditioning geometry census
# over per-head GDN recurrent states (r_ent / r_stable / query-alignment
# closed forms; cyclic-Jacobi spectrum in f64, Issue-940 deterministic
# folds). Offline, REPORT-ONLY, zero new deps (blake3/anyhow in-tree).
# The T0.2 FiLM probe filter rides the same gate. The capture seam:
# state snapshots happen in the DRIVER (states are durably held in
# HybridCache between steps — zero forward-body edits, the sink_audit
# extraction lesson); the query-gain capture arm rides the scratch the
# way sink_audit_q does (its scratch field + write-sites are the
# compile-window wiring step). The `lattice-census` bin is the census
# front (required-features row in the same commit — the P30 law).
lattice_census = ["deltanet_ternary_inference"]

# riir-infer Issue 1242 T1 - the KL-vs-anchor ranked-selection census
# (the QDA distill anchor instrument): per-token forward-KL from logits
# slices + the top-k-union variant + the trace-set aggregation, OPT-IN,
# offline report-only, zero new deps. The anchor logits cache rides the
# census bins (content-addressed per model bytes + trace set + dtype).
# Pulls the dense deltanet loaders/forwards (the teacher/student GGUF path).
anchor_kl = ['deltanet_inference']
# Issue 036 T1/T2: the LittleBit-derived init-only sub-1-bit PTQ lane —
# `quant::svd_lbit` (seeded Halko truncated SVD + Dual-SVID init + residual
# restack, deterministic) + the `svd_lbit_eval` PPL-ladder bin. Opt-in per
# the lossy-surface law: measurement-only, never a serving path; ZERO new
# deps (fastrand/rayon/half already in the tree).
svd_lbit = []
# vk_calibration (katgpt-rs Issue 883 P0, 2026-09-25): the gemma-2 V/K
# calibration lane — `transformer::gemma2_calibration` (tapped f16
# forward, no lm_head) + the `vk_calibration` bin (the offline R²
# dashboard over a natural-text corpus; measurement-only by the issue's
# P0 law). Forwards katgpt-core's `fitted_anchor_tables` (the shared
# 882+883 substrate, katgpt-rs Bench 886). OPT-IN per the
# no-default-consumer rule — the dashboard is an offline instrument,
# never a serving path.
vk_calibration = []
# gemma2_qkv (riir-infer Issue 013 T1, 2026-09-28): the serve-shaped
# quantized-KV gemma-2 forward — `transformer::gemma2_quantized` (the
# `forward_gemma2_f16` layer stack with the KV cache behind the
# `QuantizedKVCache` trait + a dequant mirror; T2/T3 consume the same
# forward). Forwards katgpt-core's `fitted_value_tables` (the P1
# `MeanRemovedValueCache` decorator — implies the fitted_anchor_tables
# substrate) and pulls katgpt-kv/kvarn (the designated backend, BOUNDARY
# allowlist row added with this feature). OPT-IN: a measurement-lane
# capability, never a default-feature serving path.
gemma2_qkv = ["dep:katgpt-kv", "katgpt-kv/kvarn"]
# vk_p1_g1 (riir-infer Issue 013 T1, 2026-09-28): the P1 model-bound G1
# bin — calibration slice → FittedTokenTable, then the PPL arms
# (f16 control / plain-KVarN / mean-removed) + the cache-level MSE replay
# against the same f16-trajectory captures (Gate 1), all under the
# pre-registered protocol in the issue. Implies both halves above.
# OPT-IN, measurement-only (the P0 law carries: the bin makes no serving
# claim; Gate 2 decides quality).
vk_p1_g1 = ["vk_calibration", "gemma2_qkv"]
# katgpt-rs Issue 919 T3 (2026-10-06): the KV-cache A/B lane — the
# measured-diagonal per-channel exemption vs per-block absmax (the
# quant::kvq_ab backends + the T3 bin). Needs the same two gates as
# vk_p1_g1: the gemma-2 f16 loader (vk_calibration) + the quantized-KV
# mirror forward (gemma2_qkv). The kvq_ab backends themselves are UNGATED
# (pure quant math over q8kv + the katgpt-types trait) and lib-tested at
# default features.
spike_census_t3 = ["vk_calibration", "gemma2_qkv"]
# Issue 919 T3 cell 2 (2026-10-06): the SAME A/B on the decisive strong-MA
# cell — Ternary-Bonsai-2.5-27B-PQ2_0 (qwen35 hybrid). Needs the ternary/GDN
# forward (deltanet_ternary_inference — `deltanet::ternary_kvq`, the
# quantized-KV seam) + the folded-file loader (bonsai2_hadamard implies it).
spike_census_t3_ternary = ["deltanet_ternary_inference", "bonsai2_hadamard"]
# katgpt-rs Issue 919 T4 (2026-10-07): the delimiter-sink constancy probe —
# pre-RoPE K/V captured at delimiter positions across windows
# (`ValueStoreHook::keys_pre_rope` + `value_stored`), cross-prompt pairwise
# cosine + collapse stats vs the pre-registered 0.99 bar. Needs only the
# gemma-2 f16 loader (vk_calibration); no quant backends.
spike_census_t4 = ["vk_calibration"]
# katgpt-rs Issue 920 T1 (2026-10-07): the HyperThink modelless delta-overlay
# lane — the gemma-2 f16 forward re-forked at the six projection-OUTPUT hook
# points (`transformer::gemma2_bias_delta`, K excluded by construction) + the
# T1 capture bin (paired with_c/plain sweeps over seed-pinned GSM8K probes →
# per-probe Δ dump + global Δb table + the pre-registered ρ capture-ratio
# premise check). Needs the f16 loader (vk_calibration) + the bias-delta
# vocabulary (katgpt-pruners, the builder the bin accumulates through).
# OPT-IN, measurement-only: no serving claim; the issue's pre-registered
# gates decide.
hyperthink_t1 = ["vk_calibration", "dep:katgpt-pruners", "katgpt-pruners/bias_delta"]
# row_logit_floor (riir-infer Issue 011 T1, 2026-09-25): the opt-in consumer
# of katgpt-core's sink-exempt row-logit floor + b-bit logit code +
# exp-table softmax (katgpt-rs Issue 882 P2, Bench 888) —
# `transformer::attention_floor`, selected per call by
# `ForwardContext::logit_floor` on the gemma-2 f16 forward, + the
# `row_logit_floor_ppl` bin (the T2/T4 quality gate). OPT-IN: promotion is
# katgpt-rs-side and waits on T2 + T3.
row_logit_floor = ["katgpt-core/attention_memory"]
# scale_invariant_attn (Plan 622 Phase 7, 2026-10-11): the scale-invariant
# attention lane for the riir-infer kernels — `transformer::attention_si`
# (the affine-in-logit-space kernel + the load-time σ probe + the armed
# session vocabulary) riding the packed Bonsai ternary decode path, + the
# `si_zero_shot_ppl` G3 harness bin (the zero-shot split:
# calibrated / uncalibrated / pp-RoPE-expected-FAIL). Forwards katgpt-core's
# `scale_invariant_attn` (the schedule LUT + HeadCalibration +
# SpreadAccumulator substrate). IMPLIES `deltanet_ternary_inference`: the
# riir-infer vehicle for the lane is the packed Bonsai ternary decode path
# (the module doc's law — the GDN layers have no per-key logits, the
# audited discard), so the kernel + the wiring tests + the loader's
# pp-mark reader all need the ternary stack live (Config::qwen_deltanet /
# TernaryGroupWeights / ternary_forward ride it). OPT-IN — the Phase-7
# GOAT (G2 engine cells + G3) is open; promotion is a separate owner call.
scale_invariant_attn = ["katgpt-core/attention_memory", "deltanet_ternary_inference"]
# Plan 623 (2026-10-26) — the multi-host pipeline substrate (Phase 1): LayerRange
# + ActivationFrame wire (f32/bf16 little-endian, RNE bf16 widening, zero-alloc
# decode fast path), the per-range HybridCache state-segment serializer (closes
# the Issue-028 out-of-process gap), the stage handshake (refuse-on-mismatch),
# and the range-forward seams on the qwen-deltanet-ternary + gemma2 CPU
# reference paths (composed stages bit-identical to the full forward — the G1
# gate). Opt-in, never default; implies deltanet_inference (the segment
# serializer reads DeltaNet layer state).
multi_host = ["deltanet_inference"]
# golden_nll (Issue 959 T6, 2026-10-24): the f64 golden-NLL lossy-quant
# readout — riir-infer_core::golden_nll (the reusable oracle: widen-once
# scratch + per-token NLL via katgpt-core's fixed_log_softmax_target_f64,
# the argmax-excluded-LSE softplus form) + the `--golden-nll` arm on
# `si_zero_shot_ppl` (pooled incumbent-vs-golden Δ, the confidence-band
# split at the fp32/f64 cliffs, the disagreement census). The tail-faithful
# readout the lossy-surface gates consume (PQ2_0 / GDN_STATE_HALF
# arms wire their own two-variant diffs through it). Forwards
# katgpt-core/fixed_log_softmax. Instrument-grade — never a serving path.
# OPT-IN measurement lane.
golden_nll = ["katgpt-core/diagnostics"]

# deletion_mask (Issue 1208 T1, 2026-11-12): the deletion-mask artifact
# codec — bit-packed keep/delete stream over frozen weights, base-BLAKE3
# binding, RLE-then-zstd payload, optional Ed25519, the typed refusal
# battery. Self-contained leaf under src/adapter/; the serving-side
# application (T2) and the PQ2_0 LUT (T3) join this feature. The
# promotion-bar feature name is pre-pinned by riir-train Research 493.
deletion_mask = ["dep:zstd", "dep:ed25519-dalek", "q2_0_ternary_bridge", "deltanet_inference", "svd_lbit"]
# act_diagonal_calibration (riir-infer Issue 014 T1, 2026-09-26): the
# activation-diagonal collector over the Bonsai-2 ternary lane — the
# `vk_calibration` shape at the Issue-886 tap points (linear-layer INPUTS,
# observed beside each ternary matvec through the existing
# `TernaryMatvecHook` seam; the forward runs the same CPU SIMD kernel, so
# the pass is bit-identical to an unhooked run). Forwards katgpt-core's
# `act_channel_moments` (Issue 886 P0). OPT-IN, measurement-only: the
# artifact is the T2 refit input, never a serving path. Implies the
# bonsai-2 loading stack (ternary_inference + bonsai2_hadamard) because
# the collector walks the qwen35 hybrid ternary weights.
act_diagonal_calibration = [
    "katgpt-core/diagnostics",
    "ternary_inference",
    "bonsai2_hadamard",
]
# act_scale_refit (riir-infer Issue 014 T2/T3, 2026-09-26): the act-aware
# ternary scale-refit arms + the per-family conditional retention walk that
# gates them (the katgpt-rs Issue 886 P1 model-bound quality gate — the walk
# katgpt-rs cannot run: it needs the born-ternary, Hadamard-rotated Bonsai-2
